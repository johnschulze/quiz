<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Operatoren-Quiz – Politische Bildung</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#fff;color:#1a1a1a;display:flex;justify-content:center;font-size:16px}
#app{width:100%;max-width:1400px;height:100vh;height:100dvh;padding:.35rem .8rem;display:flex;flex-direction:column;gap:.35rem;overflow:hidden}
.top{display:flex;align-items:center;gap:.6rem;color:#555;font-size:.8rem;flex:0 0 auto}
.top b{color:#1a1a1a}
.top .mid{flex:1;display:flex;align-items:center;gap:.6rem;min-width:0}
.tag{background:#1a56db;color:#fff;border-radius:.4rem;font-size:.8rem;padding:.05rem .55rem;white-space:nowrap}
.bar{flex:1;height:.4rem;background:#e5e7eb;border-radius:.3rem;min-width:2rem}
.bar i{display:block;height:100%;background:#1e3a5f;border-radius:.3rem;transition:width .3s}
button.c{font-size:.8rem;padding:.2rem .8rem;border-radius:.4rem;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
button.c:hover{border-color:#1a56db;color:#1a56db}
button.c.p{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
h1{font-size:1.15rem;font-weight:600;line-height:1.25;flex:0 0 auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;flex:0 0 auto}
.opt{display:flex;gap:.5rem;align-items:center;text-align:left;font-size:.95rem;line-height:1.2;padding:.35rem .6rem;border:2px solid #d1d5db;border-radius:.6rem;background:#f3f4f6;color:#1a1a1a;cursor:pointer;font-family:inherit}
.opt:hover{border-color:#1a56db}
.opt b{flex-shrink:0;width:1.7rem;height:1.7rem;border-radius:50%;background:#1e3a5f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.no{background:#fef2f2;border-color:#dc2626;animation:sh .35s}
.opt.off{opacity:.55;cursor:default}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.expl{font-size:.85rem;line-height:1.25;color:#1e3a5f;background:#eaf0f7;border-radius:.6rem;padding:.35rem .6rem;visibility:hidden;flex:0 0 auto}
.end{text-align:center;margin:auto}
.end h1{font-size:2rem;margin-bottom:.4rem}.end p{font-size:1.3rem;margin-bottom:.8rem}
</style></head><body><div id="app"></div>
<script>
const Q=[{"t": "nennen", "q": "Aufgabe: „Nennen Sie zwei Möglichkeiten, sich politisch zu beteiligen.“ Welche Antwort nennt?", "o": ["Politische Beteiligung ist wichtig, weil die Bürger so mitbestimmen können", "Ich finde, dass jeder wählen gehen sollte", "Wählen gehen und an einer Demonstration teilnehmen", "Politische Beteiligung heißt, dass Bürger bei Entscheidungen mitwirken"], "c": 2, "e": "nennen = kurz aufzählen, ohne Erklärung."}, {"t": "beschreiben", "q": "Aufgabe: „Beschreiben Sie, wie eine Briefwahl abläuft.“ Welche Antwort beschreibt?", "o": ["Man bekommt die Unterlagen per Post, kreuzt zu Hause an und schickt den Wahlbrief rechtzeitig zurück", "Wahlschein, Stimmzettel, Wahlbrief", "Die Briefwahl ist besser als die Wahl im Wahllokal", "Briefwahl ist gut, weil man nicht ins Wahllokal gehen muss"], "c": 0, "e": "beschreiben = sachlich sagen, was zu sehen oder zu lesen ist, ohne Urteil und ohne Erklärung."}, {"t": "wiedergeben", "q": "Aufgabe: „Eine Zeitung berichtet: ‚Die Stadt baut eine neue Busspur. Dafür fallen 20 Parkplätze weg, aber die Busse kommen schneller voran.‘ Geben Sie den Inhalt mit eigenen Worten wieder.“ Welche Antwort gibt wieder?", "o": ["„Dafür fallen 20 Parkplätze weg, aber die Busse kommen schneller voran.“", "Busspur, Parkplätze, Busse", "Ich ärgere mich, dass Parkplätze wegfallen", "Die Stadt richtet eine Busspur ein. Parkplätze fallen weg, dafür sind die Busse schneller"], "c": 3, "e": "wiedergeben = mit eigenen Worten sagen, was im Material steht. Abschreiben oder bewerten reicht nicht."}, {"t": "erklären", "q": "Aufgabe: „Erklären Sie, warum es einen Mindestlohn gibt.“ Welche Antwort erklärt?", "o": ["Mindestlohn, Tarifvertrag, Urlaubsanspruch", "Es gibt einen Mindestlohn, weil Arbeitnehmer von ihrem Lohn leben können sollen", "Der Mindestlohn ist gerecht, deshalb finde ich ihn gut", "Der Mindestlohn ist der niedrigste Lohn, den ein Arbeitgeber zahlen darf"], "c": 1, "e": "erklären = Warum ist das so? Merke: Bei „erklären“ steht ein „weil“."}, {"t": "erläutern", "q": "Aufgabe: „Erläutern Sie, warum Datenschutz wichtig ist.“ Welche Antwort erläutert?", "o": ["Datenschutz ist wichtig, weil Daten missbraucht werden können", "Datenschutz bedeutet, dass persönliche Daten geschützt werden", "Persönliche Daten können missbraucht werden. Beispiel: Mit gestohlenen Daten kann jemand in Ihrem Namen im Internet einkaufen", "Ich finde Datenschutz sehr wichtig"], "c": 2, "e": "erläutern = erklären und ein Beispiel dazu nennen. Ohne Beispiel ist es nur „erklären“."}, {"t": "vergleichen", "q": "Aufgabe: „Vergleichen Sie Bus und Auto im Alltag.“ Welche Antwort vergleicht?", "o": ["Beide bringen Sie ans Ziel. Das Auto ist flexibler, der Bus meist billiger", "Der Bus ist besser, weil er billiger ist", "Bus, Auto, Fahrrad, Zug", "Der Bus ist billig und fährt nach Fahrplan"], "c": 0, "e": "vergleichen = Gemeinsamkeiten und Unterschiede nennen. Nur eine Seite oder ein Urteil reicht nicht."}, {"t": "beurteilen", "q": "Aufgabe: „Beurteilen Sie, ob ein Pfand auf Flaschen sinnvoll ist.“ Welche Antwort beurteilt?", "o": ["Beim Pfand bekommt man Geld zurück, wenn man die Flasche abgibt", "Pfand, Mehrweg, Einweg", "Das Pfand ist sinnvoll", "Das Pfand ist sinnvoll, weil so mehr Flaschen zurückgegeben werden und weniger Müll in der Natur liegt"], "c": 3, "e": "beurteilen = ein Urteil fällen und begründen. Ein Urteil ohne „weil“ reicht nicht."}, {"t": "Stellung nehmen", "q": "Aufgabe: „Nehmen Sie Stellung zur Aussage: ‚Handys sollten im Unterricht verboten sein.‘“ Welche Antwort nimmt Stellung?", "o": ["Ein Handyverbot bedeutet, dass Handys im Unterricht nicht benutzt werden dürfen", "Ich bin dagegen, weil man mit dem Handy auch schnell etwas nachschlagen kann", "Handy, Tablet, Laptop", "Viele Schulen haben eine Handyregel in der Hausordnung"], "c": 1, "e": "Stellung nehmen = die eigene Meinung sagen und begründen."}, {"t": "diskutieren", "q": "Aufgabe: „Diskutieren Sie, ob auf Autobahnen ein Tempolimit gelten sollte.“ Welche Antwort diskutiert?", "o": ["Dafür: weniger Unfälle und weniger Abgase. Dagegen: Fahrer fühlen sich bevormundet. Ergebnis: Ein Tempolimit ist sinnvoll, weil Sicherheit wichtiger ist", "Ich bin gegen ein Tempolimit, weil Autofahrer frei fahren wollen", "Ein Tempolimit legt fest, wie schnell man höchstens fahren darf", "Tempolimit, Autobahn, Geschwindigkeit"], "c": 0, "e": "diskutieren = Pro und Kontra nennen, am Ende ein Ergebnis. Eine einseitige Meinung reicht nicht."}, {"t": "nennen", "q": "Aufgabe: „Nennen Sie zwei Medien, mit denen man sich über Politik informieren kann.“ Welche Antwort nennt?", "o": ["Medien informieren die Bürger und kontrollieren die Politik", "Zeitung und Nachrichtensendung im Fernsehen", "Ich informiere mich am liebsten im Radio, weil es bequem ist", "Medien sind Mittel, mit denen Informationen verbreitet werden"], "c": 1, "e": "nennen = kurz aufzählen, ohne Erklärung."}, {"t": "beschreiben", "q": "Aufgabe: „Eine Grafik zeigt: 2015 lasen 60 % der Befragten täglich online Nachrichten, 2025 waren es 80 %. Beschreiben Sie die Grafik.“ Welche Antwort beschreibt?", "o": ["Immer mehr Menschen lesen online, weil fast jeder ein Smartphone hat", "Das ist eine gute Entwicklung", "60 %, 80 %, 2015, 2025", "Der Anteil stieg von 60 % im Jahr 2015 auf 80 % im Jahr 2025"], "c": 3, "e": "beschreiben = sachlich sagen, was zu sehen oder zu lesen ist, ohne Urteil und ohne Erklärung."}, {"t": "wiedergeben", "q": "Aufgabe: „Eine Bürgermeisterin sagt: ‚Wir bauen zwei neue Radwege und sanieren die Schule. Das Geld dafür kommt vom Land.‘ Geben Sie den Inhalt mit eigenen Worten wieder.“ Welche Antwort gibt wieder?", "o": ["„Wir bauen zwei neue Radwege und sanieren die Schule.“", "Radwege, Schule, Land", "Die Bürgermeisterin kündigt zwei Radwege und eine Schulsanierung an. Das Land bezahlt dafür", "Ich finde gut, dass das Land das Geld gibt"], "c": 2, "e": "wiedergeben = mit eigenen Worten sagen, was im Material steht. Abschreiben oder bewerten reicht nicht."}, {"t": "erklären", "q": "Aufgabe: „Erklären Sie, warum Wahlen geheim sind.“ Welche Antwort erklärt?", "o": ["Wahlen sind geheim, weil niemand wegen seiner Wahl unter Druck gesetzt werden soll", "In der Wahlkabine hängt ein Vorhang, und der Zettel kommt in die Urne", "Wahlkabine, Wahlzettel, Wahlurne", "Die geheime Wahl ist gut und wichtig"], "c": 0, "e": "erklären = Warum ist das so? Merke: Bei „erklären“ steht ein „weil“."}, {"t": "erläutern", "q": "Aufgabe: „Erläutern Sie, warum die Pressefreiheit wichtig ist.“ Welche Antwort erläutert?", "o": ["Die Presse ist wichtig, weil sie die Politik kontrolliert", "Die Presse kontrolliert die Politik. Beispiel: Eine Zeitung deckt auf, dass eine Stadt Steuergeld verschwendet hat", "Die Pressefreiheit steht im Grundgesetz", "Pressefreiheit ist sehr wichtig für die Demokratie"], "c": 1, "e": "erläutern = erklären und ein Beispiel dazu nennen. Ohne Beispiel ist es nur „erklären“."}, {"t": "vergleichen", "q": "Aufgabe: „Vergleichen Sie Zeitung und Internet als Quelle für Nachrichten.“ Welche Antwort vergleicht?", "o": ["Das Internet ist besser, weil es schneller ist", "Zeitung und Internet sind Medien", "Im Internet kann jeder etwas schreiben und sofort veröffentlichen", "Beide informieren über Politik. In der Zeitung prüfen Redakteure die Texte, im Internet kann jeder etwas schreiben"], "c": 3, "e": "vergleichen = Gemeinsamkeiten und Unterschiede nennen. Nur eine Seite oder ein Urteil reicht nicht."}, {"t": "beurteilen", "q": "Aufgabe: „Beurteilen Sie, ob man sich beim Bürgeramt auch online anmelden können sollte.“ Welche Antwort beurteilt?", "o": ["Beim Bürgeramt melden sich Bürger an, wenn sie umziehen", "Bürgeramt, Online-Formular, Termin", "Das ist sinnvoll, weil man sich Wege und Wartezeit spart", "Die Online-Anmeldung ist sinnvoll"], "c": 2, "e": "beurteilen = ein Urteil fällen und begründen. Ein Urteil ohne „weil“ reicht nicht."}, {"t": "Stellung nehmen", "q": "Aufgabe: „Nehmen Sie Stellung zur Aussage: ‚Ein soziales Jahr sollte für alle Pflicht sein.‘“ Welche Antwort nimmt Stellung?", "o": ["Ich bin dagegen, weil eine Pflicht die Freiheit einschränkt", "In einem sozialen Jahr arbeiten junge Menschen für wenig Geld in sozialen Einrichtungen", "Soziales Jahr, Zivildienst, Bundeswehr", "Ein soziales Jahr ist ein Freiwilligendienst"], "c": 0, "e": "Stellung nehmen = die eigene Meinung sagen und begründen."}, {"t": "diskutieren", "q": "Aufgabe: „Diskutieren Sie, ob in Deutschland eine Wahlpflicht eingeführt werden sollte.“ Welche Antwort diskutiert?", "o": ["Ich bin gegen die Wahlpflicht, weil Wählen freiwillig sein soll", "Dafür: Mehr Menschen würden wählen. Dagegen: Wählen ist ein Recht, kein Zwang. Ergebnis: Ich bin gegen die Wahlpflicht, weil Freiheit wichtiger ist", "Bei einer Wahlpflicht müssten alle Bürger wählen gehen", "Wahlpflicht, Wahlrecht, Wahlbeteiligung"], "c": 1, "e": "diskutieren = Pro und Kontra nennen, am Ende ein Ergebnis. Eine einseitige Meinung reicht nicht."}];
let i=0,score=0,done=false,res=[];
const app=document.getElementById('app');
function fit(){
 const root=document.documentElement;
 let fs=Math.min(30,Math.max(9,window.innerHeight/13));
 root.style.fontSize=fs+'px';
 while(app.scrollHeight>app.clientHeight+1&&fs>7){fs-=0.5;root.style.fontSize=fs+'px';}
}
function render(){
 if(i>=Q.length){
  app.innerHTML='<div class="end"><h1>Geschafft!</h1><p>'+score+' von '+Q.length+' richtig</p><button class="c p" onclick="restart()">↺ Noch einmal</button></div>';fit();return;}
 const q=Q[i];done=false;
 app.innerHTML='<div class="top"><button class="c" onclick="prev()">← Zurück</button><div class="mid"><span>Frage <b>'+(i+1)+'</b> / '+Q.length+'</span><span class="tag">Operator: '+q.t+'</span><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div></div><span>Richtig: <b>'+score+'</b></span><button class="c p" id="nx" style="visibility:hidden" onclick="next()">Weiter →</button></div>'
 +'<h1>'+q.q+'</h1><div class="opts">'
 +q.o.map((o,k)=>'<button class="opt" onclick="pick('+k+')"><b>'+'ABCD'[k]+'</b><span>'+o+'</span></button>').join('')
 +'</div><div class="expl" id="ex">'+q.e+'</div>';
 fit();
}
function pick(k){
 if(done)return;done=true;const q=Q[i];
 const b=document.querySelectorAll('.opt');
 b.forEach((x,j)=>{if(j==q.c)x.classList.add('ok');else if(j==k)x.classList.add('no');else x.classList.add('off')});
 res[i]=(k==q.c);if(res[i])score++;
 document.getElementById('ex').style.visibility='visible';
 document.getElementById('nx').style.visibility='visible';
}
function next(){i++;render()}
function prev(){if(i>0){i--;score=res.slice(0,i).filter(Boolean).length;res.length=i;render()}}
function restart(){i=0;score=0;res=[];render()}
document.addEventListener('keydown',e=>{
 const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
 if(m!==undefined&&i<Q.length)pick(m);
 if((e.key=='ArrowRight'||e.key=='Enter')&&done)next();
});
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));
render();
</script></body></html>
