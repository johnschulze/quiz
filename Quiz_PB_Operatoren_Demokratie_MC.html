<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operatoren-Quiz – Demokratie in Deutschland, AB S. 63–83</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,sans-serif;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;align-items:center}
#app{width:100%;max-width:1400px;padding:1rem 2rem;display:flex;flex-direction:column;height:100%}
.top{display:flex;justify-content:space-between;align-items:center;color:#555;font-size:1.1rem;margin-bottom:.6rem}
.top b{color:#1a1a1a}
.bar{height:8px;background:#e5e7eb;border-radius:4px;margin-bottom:1rem}
.bar i{display:block;height:100%;background:#1e3a5f;border-radius:4px;transition:width .3s}
.tag{display:inline-block;background:#1a56db;color:#fff;border-radius:6px;font-size:1rem;padding:.1rem .7rem;margin-bottom:.6rem}
h1{font-size:clamp(1.5rem,3.2vw,2.4rem);font-weight:600;line-height:1.3;margin-bottom:1.2rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opt{display:flex;gap:.8rem;align-items:center;text-align:left;font-size:clamp(1.15rem,2.2vw,1.7rem);line-height:1.3;padding:.9rem 1.1rem;border:2px solid #d1d5db;border-radius:10px;background:#f3f4f6;color:#1a1a1a;cursor:pointer;min-height:5.2rem}
.opt:hover{border-color:#1a56db}
.opt b{flex-shrink:0;width:2.4rem;height:2.4rem;border-radius:50%;background:#1e3a5f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.no{background:#fef2f2;border-color:#dc2626;animation:sh .35s}
.opt.off{opacity:.55;cursor:default}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.expl{margin-top:1rem;font-size:clamp(1.05rem,1.9vw,1.5rem);line-height:1.4;color:#1e3a5f;background:#eaf0f7;border-radius:10px;padding:.8rem 1.1rem;display:none}
.expl small{display:block;color:#666;font-size:.8em;margin-top:.3rem}
.ctl{margin-top:auto;display:flex;justify-content:space-between;padding-top:1rem}
button.c{font-size:1.1rem;padding:.5rem 1.4rem;border-radius:8px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer}
button.c:hover{border-color:#1a56db;color:#1a56db}
button.c.p{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
.end{text-align:center;margin:auto}
.end h1{font-size:2.6rem}.end p{font-size:1.8rem;margin-bottom:1.5rem}
</style></head><body><div id="app"></div>
<script>
const Q=[{"t": "darstellen", "q": "Aufgabe: „Stellen Sie in eigenen Worten das Prinzip der Volkssouveränität dar. (VT, M1)“ Welche Antwort stellt dar?", "o": ["„Alle Staatsgewalt geht vom Volke aus.“ (Art. 20 GG)", "Volkssouveränität ist gut, weil die Bürger so mitbestimmen können.", "Die wichtigen Entscheidungen gehen vom Volk aus: Die Bürger wählen, und die Mehrheit bestimmt die Richtung", "Deutschland ist ein Bundesstaat, ein Rechtsstaat und ein Sozialstaat."], "c": 2, "e": "darstellen = einen Sachverhalt geordnet und in eigenen Worten wiedergeben, ohne ihn zu bewerten. Ein Zitat abzuschreiben genügt nicht.", "s": "AB S. 63, VT/M1"}, {"t": "erläutern", "q": "Aufgabe: „Auch der Staatsaufbau Deutschlands als Bundesstaat begrenzt die Macht der Regierung. Erläutern Sie, warum das so ist. (M4)“ Welche Antwort erläutert?", "o": ["Bund und Länder teilen sich die Aufgaben, die Länder haben eigene Regierungen; über den Bundesrat wirken sie an Bundesgesetzen mit, die Regierung entscheidet also nicht allein", "Ein Bundesstaat besteht aus 16 Bundesländern, die zusammen den Gesamtstaat bilden.", "Die Bundesregierung ist machtlos, weil die Länder alles allein bestimmen.", "Der Bundeskanzler wird nur für vier Jahre gewählt, deshalb hat er wenig Macht."], "c": 0, "e": "erläutern = erklären und mit einem Beispiel oder Beleg veranschaulichen. Beleg hier: Der Bundesrat beteiligt die Länder an der Gesetzgebung des Bundes.", "s": "AB S. 63/64, M4"}, {"t": "vergleichen", "q": "Aufgabe: „Vergleichen Sie das Verfassungsschema der Bundesrepublik (M1) mit dem Schema der Gewaltenteilung (S. 63, M2).“ Welche Antwort vergleicht?", "o": ["Das Schema der Bundesrepublik zeigt Bundestag, Bundeskanzler, Bundesrat und Bundesverfassungsgericht mit Pfeilen für die Kontrolle.", "Das klassische Modell ist übersichtlicher und deshalb besser.", "Beide Schemata zeigen drei Gewalten: Legislative, Exekutive und Judikative.", "Beide kennen drei Gewalten; im klassischen Modell sind Gesetzgebung und Regierung getrennt, in der Bundesrepublik sind sie verschränkt, denn die Regierung geht aus der Parlamentsmehrheit hervor"], "c": 3, "e": "vergleichen = Gemeinsamkeiten und Unterschiede nennen. Nur ein Schema zu beschreiben, nur Gemeinsamkeiten zu nennen oder ein Urteil zu fällen reicht nicht.", "s": "AB S. 64/65, M1/M2"}, {"t": "erklären", "q": "Aufgabe: „Erklären Sie mithilfe des Prinzips der Funktionen-Trennung, warum Gesetzesinitiativen der Bundesregierung am erfolgreichsten sind. (M2, M5)“ Welche Antwort erklärt?", "o": ["88 % der Vorschläge der Bundesregierung werden Gesetz, beim Bundestag sind es 34 %, beim Bundesrat 24 %.", "Die Regierung geht aus den Mehrheitsfraktionen hervor und wird von ihnen getragen; deshalb stimmt die Mehrheit im Bundestag ihren Vorschlägen meist zu", "Die Opposition kontrolliert die Regierung und stimmt ihren Vorschlägen deshalb immer zu.", "Die Bundesregierung kann Gesetze allein beschließen, ohne dass der Bundestag zustimmen muss."], "c": 1, "e": "erklären = ein Warum beantworten: Ursache und Zusammenhang nennen. Die Zahlen zeigen nur, dass es so ist, nicht warum.", "s": "AB S. 65, M2/M5"}, {"t": "interpretieren", "q": "Aufgabe: „Interpretieren Sie die Karikatur M1. Beziehen Sie M5 ein.“ Welche Antwort interpretiert?", "o": ["Ein Mann in Uniform und mit Sonnenbrille sitzt am Tisch, vier Personen sprechen in Sprechblasen.", "Die Karikatur zeigt eine faire Wahl, bei der alle Berater gleichberechtigt mitbestimmen.", "Der Diktator lässt sich Tricks nennen, wie er die Wahl „gewinnt“: einschüchtern, Kandidaten verschwinden lassen, Zettel fälschen, im Netz hetzen. Das verstößt gegen die Wahlgrundsätze (frei, gleich, geheim)", "Die Karikatur ist gut gezeichnet und sehr witzig."], "c": 2, "e": "interpretieren = das Bild zuerst beschreiben, dann die Aussage deuten und mit dem Material (hier M5) verbinden. Beschreiben allein oder ein Urteil über die Zeichnung reichen nicht.", "s": "AB S. 66, M1/M5"}, {"t": "beurteilen", "q": "Aufgabe: „Beurteilen Sie die beiden Wahlverfahren.“ Welche Antwort beurteilt?", "o": ["Die Verhältniswahl ist gerechter, weil alle Gruppen im Parlament vertreten sind; die Mehrheitswahl schafft klarere Mehrheiten, lässt aber Stimmen verfallen. Was besser ist, hängt vom Ziel ab", "Das Verhältniswahlrecht ist besser.", "Beim Mehrheitswahlrecht gewinnt in jedem Wahlkreis der Kandidat mit den meisten Stimmen.", "Beide Verfahren werden in Deutschland gleichzeitig benutzt: bei der Wahl zum Bundestag zählen Erst- und Zweitstimme."], "c": 0, "e": "beurteilen = ein Urteil fällen und es mit Kriterien begründen (hier: Gerechtigkeit und stabile Regierung). Ein Urteil ohne Grund oder eine bloße Beschreibung genügt nicht.", "s": "AB S. 66/67"}, {"t": "herausarbeiten", "q": "Aufgabe: „Arbeiten Sie heraus, in welchem Maße die Wahlbeteiligung vom Alter abhängt. (M4)“ Welche Antwort arbeitet heraus?", "o": ["Die meisten Nichtwähler sind 21 bis 24 Jahre alt: 33,0 %.", "Junge Menschen interessieren sich nicht für Politik und gehen deshalb nicht wählen.", "Eine niedrige Wahlbeteiligung schadet der Demokratie.", "Von den 21- bis 24-Jährigen (33,0 % Nichtwähler) bis zu den 60- bis 69-Jährigen (19,2 %) sinkt der Anteil der Nichtwähler fast stetig; bei den Ältesten steigt er wieder (24,2 %)"], "c": 3, "e": "herausarbeiten = aus dem Material einen Zusammenhang erkennen, der nicht wörtlich dasteht (hier: der Verlauf über die Altersgruppen). Ein einzelner Wert oder eine nicht belegte Vermutung genügt nicht.", "s": "AB S. 67, M4"}, {"t": "begründen", "q": "Aufgabe: „Demokratische Wahlen werden in der Regel von internationalen Wahlbeobachtern überprüft. Begründen Sie, warum dies sinnvoll ist.“ Welche Antwort begründet?", "o": ["Wahlbeobachter kommen aus dem Ausland und beobachten die Wahl.", "Weil unabhängige Beobachter von außen prüfen, ob die Wahl frei, gleich und geheim abläuft; so lassen sich Betrug und Druck auf Wähler besser erkennen", "Weil Wahlbeobachter die Stimmen zählen und das Ergebnis bekannt geben.", "Ich finde es sinnvoll."], "c": 1, "e": "begründen = eine Behauptung mit „weil“ und einem Beleg stützen. Eine bloße Feststellung oder die Aussage „Ich finde es sinnvoll“ ist noch keine Begründung.", "s": "AB S. 67"}, {"t": "entwickeln", "q": "Aufgabe: „Entwickeln Sie Vorschläge, wie Politiker und Parteien mehr Vertrauen bei den Bürgerinnen und Bürgern gewinnen können. (M1, M4)“ Welche Antwort entwickelt?", "o": ["Politiker sollten ehrlich und unbestechlich auftreten und Wahlversprechen einhalten; so werden weniger Erwartungen enttäuscht, und das Misstrauen sinkt", "Das Misstrauen kommt von schlechten Erfahrungen und unerfüllten Erwartungen.", "Parteien erhalten Geld vom Staat und aus Mitgliedsbeiträgen.", "Die Politiker müssen einfach besser werden."], "c": 0, "e": "entwickeln = eigene, konkrete Vorschläge entwerfen. Die Ursache des Problems oder ein Fakt sind kein Vorschlag, und „besser werden“ ist zu vage.", "s": "AB S. 69, M1/M4"}, {"t": "nennen", "q": "Aufgabe: „Nennen Sie weitere Beispiele für die verschiedenen Arten von Verbänden. (VT)“ Welche Antwort nennt?", "o": ["Verbände sind wichtig, weil sie Politikern ihr Fachwissen zur Verfügung stellen.", "Verbände sind manchmal zu mächtig, weil sie Gesetze in ihrem Sinne beeinflussen.", "Deutscher Fußball-Bund, Bundesverband der deutschen Industrie, Verbraucherzentrale Bundesverband, Deutscher Gewerkschaftsbund", "Verbände nehmen Einfluss durch Anhörungen, Beratung und Demonstrationen."], "c": 2, "e": "nennen = kurz aufzählen, ohne Erklärung und ohne Urteil. Hier: Namen von Verbänden. Gründe, Wirkung und Wege sind eine andere Aufgabe.", "s": "AB S. 70/71, VT"}, {"t": "erklären", "q": "Aufgabe: „Erklären Sie, warum die Medien als vierte Gewalt bezeichnet werden, und stellen Sie den Zusammenhang zu den anderen drei Gewalten her. (VT, M1, M5)“ Welche Antwort erklärt?", "o": ["Zu den Medien zählen Zeitung, Radio, Fernsehen und Online-Angebote.", "Weil die Medien nach Parlament, Regierung und Gerichten an vierter Stelle im Staat stehen.", "Die Medien haben heute sehr viel Macht, und das finde ich nicht gut.", "Weil die Medien die Politik kontrollieren und Skandale aufdecken; so kontrollieren sie wie eine zusätzliche Gewalt auch Parlament, Regierung und Gerichte"], "c": 3, "e": "erklären = ein Warum beantworten und den Zusammenhang herstellen. Die Medien hinterfragen, kontrollieren und bewerten die Politik, deshalb „vierte Gewalt“.", "s": "AB S. 72/73, VT"}, {"t": "gegenüberstellen und abwägen", "q": "Aufgabe: „Stellen Sie Vor- und Nachteile der Information durch die neuen Medien einander gegenüber und wägen Sie ab. (VT, M3, M4)“ Welche Antwort stellt gegenüber und wägt ab?", "o": ["Informationen sind jederzeit abrufbar, oft kostenlos, und jeder kann sich äußern.", "Vorteile: jederzeit abrufbar, oft kostenlos, viele Stimmen. Nachteile: sehr unterschiedliche Qualität, oberflächliche Darstellung. Abwägung: Der Nutzen ist groß, wenn man die Quellen prüft", "Die Qualität ist sehr unterschiedlich, und der „Fastfood-Journalismus“ nimmt zu.", "Im Durchschnitt nutzen die 14- bis 69-Jährigen täglich 557 Minuten Medien."], "c": 1, "e": "gegenüberstellen = Vor- und Nachteile nebeneinanderstellen; abwägen = am Ende gewichten und ein Ergebnis nennen. Nur eine Seite oder nur Zahlen reichen nicht.", "s": "AB S. 72/73"}, {"t": "Stellung nehmen", "q": "Aufgabe: „Nehmen Sie Stellung zur Aussage der Karikatur M6.“ Welche Antwort nimmt Stellung?", "o": ["Ich stimme teilweise zu: Viele informieren sich nur nebenbei und oberflächlich, andere vergleichen gezielt mehrere Quellen. Mündig ist, wer das tut", "Ein Mann mit Hut fragt einen Mann auf dem Sofa, ob er der „mündige Bürger“ ist.", "Die Karikatur zeigt: Der „mündige Bürger“ liegt passiv mit Handy und Snacks auf dem Sofa, statt sich aktiv zu informieren.", "Karikaturen übertreiben immer und sind deshalb nicht ernst zu nehmen."], "c": 0, "e": "Stellung nehmen = die eigene Meinung zur Aussage sagen und begründen. Die Pointe zu erklären ist dagegen die Aufgabe „Interpretieren“ oder „Erklären“.", "s": "AB S. 73, M6"}, {"t": "beschreiben", "q": "Aufgabe: „Beschreiben Sie den Zusammenhang zwischen Fake News und dem Vertrauensverlust der Politik. (VT, M3, M4)“ Welche Antwort beschreibt?", "o": ["Fake News sind gefährlich und sollten verboten werden.", "Fake News ist die englische Bezeichnung für bewusst verbreitete Falschmeldungen.", "Wer Falschmeldungen und Verschwörungstheorien glaubt, vertraut Medien, Parteien und Politikern weniger; manche gehen dann nicht mehr wählen oder schließen sich populistischen Bewegungen an", "Ganze Dörfer in Indien gerieten in Panik, weil ein Video per WhatsApp weitergeleitet wurde."], "c": 2, "e": "beschreiben = sachlich wiedergeben, was im Material steht, ohne Urteil und ohne Forderung. Hier: der Zusammenhang aus M3 (Verschwörungstheorien zerstören Vertrauen).", "s": "AB S. 74/75, VT/M3"}, {"t": "erörtern", "q": "Aufgabe: „Erörtern Sie mögliche Maßnahmen, die Staat und Netzwerkbetreiber gegen Fake News ergreifen können. (M5)“ Welche Antwort erörtert?", "o": ["Der Staat soll Fake News einfach verbieten.", "Eine Maßnahme ist, das Weiterleiten zu begrenzen wie bei WhatsApp. Vorteil: Falschmeldungen verbreiten sich langsamer. Nachteil: Die Beiträge sind verschlüsselt, Kontrolle ist schwer. Ergebnis: Allein reicht das nicht", "In Indien wurden rund 20 Männer wegen falscher Nachrichten getötet.", "Fake News sind bewusst verbreitete Falschmeldungen."], "c": 1, "e": "erörtern = Pro und Kontra zu einer Frage abwägen und zu einem Ergebnis kommen. Eine bloße Forderung, ein Beispiel oder eine Definition genügt nicht.", "s": "AB S. 75, M5"}, {"t": "erläutern", "q": "Aufgabe: „Erläutern Sie den Widerspruch, der in M1 formuliert wird.“ Welche Antwort erläutert?", "o": ["Die Karikatur zeigt drei Männer nebeneinander, daneben steht ihre Aussage.", "Die Männer sind sich uneinig, wer von ihnen Meinungsfreiheit bekommen soll.", "Meinungsfreiheit steht als Grundrecht in Artikel 5 des Grundgesetzes.", "Die Männer fordern Meinungsfreiheit für sich, wollen sie aber allen anderen nehmen. Das zeigt ihr Satz im Sprechtext; Grundrechte gelten aber für alle"], "c": 3, "e": "erläutern = erklären und mit einem Beleg veranschaulichen. Beleg hier: der Sprechtext der Männer. Beschreiben allein oder ein Faktum zur Meinungsfreiheit erklärt den Widerspruch nicht.", "s": "AB S. 78/79, M1"}, {"t": "entscheiden", "q": "Aufgabe: „Entscheiden Sie, welche fünf Grundrechte für Sie persönlich am wichtigsten sind. Begründen Sie Ihre Auswahl. (M4)“ Welche Antwort entscheidet?", "o": ["Ich wähle Meinungsäußerung (Art. 5), Gleichheit vor dem Gesetz (Art. 3), Glaubensfreiheit (Art. 4), Briefgeheimnis (Art. 10) und Unverletzlichkeit der Wohnung (Art. 13), weil ich frei sprechen, nicht benachteiligt und nicht ausspioniert werden will", "Alle Grundrechte sind gleich wichtig, deshalb wähle ich keine fünf aus.", "Meine fünf: Art. 3, 4, 5, 10 und 13.", "Die Grundrechte schützen die Menschenwürde, die Freiheit und die Gleichheit."], "c": 0, "e": "entscheiden = sich festlegen (hier: genau fünf Grundrechte wählen) und die Wahl begründen. Auswahl ohne Begründung, keine Auswahl oder ein allgemeiner Satz genügen nicht.", "s": "AB S. 78/79, M4"}, {"t": "diskutieren", "q": "Aufgabe: „Diskutieren Sie am Beispiel des Löschens von Online-Inhalten, wo die Grenzen der Meinungsfreiheit liegen. (M3, M5)“ Welche Antwort diskutiert?", "o": ["Das NetzDG verpflichtet soziale Netzwerke, strafbare Inhalte zu löschen.", "Meinungsfreiheit ist ein Grundrecht, deshalb darf im Netz nie etwas gelöscht werden.", "Dafür: Strafbare Hasskommentare dürfen verfolgt werden, das schränkt die Meinungsfreiheit nicht ein. Dagegen: Löschen Netzwerke auch erlaubte Inhalte (Overblocking), entscheiden Unternehmen statt Gerichte. Ergebnis: Die Grenze liegt bei strafbaren Äußerungen, die eine unabhängige Stelle prüfen sollte", "Overblocking heißt: Netzwerke löschen Inhalte, die nicht gegen Gesetze verstoßen."], "c": 2, "e": "diskutieren = Argumente dafür und dagegen nennen und zu einem Ergebnis kommen. Eine einseitige Meinung, ein Gesetz oder eine Definition allein genügt nicht.", "s": "AB S. 79, M3/M5"}, {"t": "zusammenfassen", "q": "Aufgabe: „Fassen Sie zusammen, worin das Grundrecht auf informationelle Selbstbestimmung besteht und worin seine Bedeutung für den Einzelnen liegt. (VT, M2, M3)“ Welche Antwort fasst zusammen?", "o": ["Der Einzelne bestimmt über Erhebung, Speicherung, Verwendung und Weitergabe seiner Daten. Das Bundesverfassungsgericht leitete es aus Art. 2 (1) GG ab und erklärte 2019 die Regelung zur Kennzeichenerfassung teilweise für verfassungswidrig. In den Niederlanden wertete die Gestapo 1939 Register mit der Religionszugehörigkeit aus.", "Jeder darf grundsätzlich selbst entscheiden, was mit seinen persönlichen Daten geschieht. Das schützt vor Überwachung und davor, dass Daten in falsche Hände geraten", "Das Grundrecht schützt vor allem Straftäter und Terroristen.", "Der Staat muss die Bürger durch mehr Überwachung besser schützen."], "c": 1, "e": "zusammenfassen = nur das Wichtigste kurz und in eigenen Worten wiedergeben. Einzelheiten, Beispiele und Jahreszahlen lässt man weg.", "s": "AB S. 80/81, VT/M2/M3"}, {"t": "überprüfen", "q": "Aufgabe: „Überprüfen Sie anhand von M2, ob die Aussagen in P5 noch auf einer demokratischen Grundhaltung beruhen, und begründen Sie Ihre Einschätzung.“ Welche Antwort überprüft?", "o": ["Ich finde die Aussagen unfair.", "Die Aussagen kritisieren politische Korrektheit und Politiker.", "Demokratie braucht eine demokratische Grundhaltung der Bürger.", "Ich prüfe jede Aussage mit den Fragen aus M2, zum Beispiel: Wird Gewalt gebilligt? Werden Gegner als Feinde dargestellt? Mein Ergebnis stütze ich mit Textstellen"], "c": 3, "e": "überprüfen = eine Aussage an Kriterien aus dem Material messen (hier: die Fragen in M2) und das Ergebnis begründen. Eine Meinung, eine Beschreibung oder ein allgemeiner Satz genügt nicht.", "s": "AB S. 82/83, M2/P5"}];
let i=0,score=0,done=false,res=[];
const app=document.getElementById('app');
function render(){
 if(i>=Q.length){
  
  app.innerHTML='<div class="end"><h1>Geschafft!</h1><p>'+score+' von '+Q.length+' richtig</p><button class="c p" onclick="restart()">↺ Noch einmal</button></div>';return;}
 const q=Q[i];done=false;
 app.innerHTML='<div class="top"><span>Frage <b>'+(i+1)+'</b> / '+Q.length+'</span><span>Richtig: <b>'+score+'</b></span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div>'
 +(q.t?'<div><span class="tag">Operator: '+q.t+'</span></div>':'')+'<h1>'+q.q+'</h1><div class="opts">'
 +q.o.map((o,k)=>'<button class="opt" onclick="pick('+k+')"><b>'+'ABCD'[k]+'</b><span>'+o+'</span></button>').join('')
 +'</div><div class="expl" id="ex"></div><div class="ctl"><button class="c" onclick="prev()">← Zurück</button><button class="c p" id="nx" style="visibility:hidden" onclick="next()">Weiter →</button></div>';
}
function pick(k){
 if(done)return;done=true;const q=Q[i];
 const b=document.querySelectorAll('.opt');
 b.forEach((x,j)=>{if(j==q.c)x.classList.add('ok');else if(j==k)x.classList.add('no');else x.classList.add('off')});
 res[i]=(k==q.c);if(res[i])score++;
 const e=document.getElementById('ex');e.style.display='block';e.innerHTML=q.e+'<small>Quelle: '+q.s+'</small>';
 document.getElementById('nx').style.visibility='visible';
}
function next(){i++;render()}
function prev(){if(i>0){i--;score=res.slice(0,i).filter(Boolean).length;res.length=i;render()}}
function restart(){i=0;score=0;res=[];render()}
document.addEventListener('keydown',e=>{
 const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
 if(m!==undefined&&i<Q.length)pick(m);
 if((e.key=='ArrowRight'||e.key=='Enter')&&done)next();
});
render();
</script></body></html>
