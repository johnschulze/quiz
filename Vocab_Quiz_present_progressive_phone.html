<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary – Present progressive</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; min-height: 100vh; padding: 0.8rem 0.8rem 1.5rem; }
.quiz-header { text-align: center; margin-bottom: 0.5rem; }
.quiz-header h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.2rem; }
.score-bar { display: flex; justify-content: center; gap: 1rem; margin-bottom: 0.6rem; font-size: 0.9rem; color: #555; flex-wrap: wrap; }
.score-bar b { color: #1a1a1a; }
.tabs { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 0.8rem; }
.tab-btn { font-size: 0.9rem; padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #ccc; background: #fff; color: #555; cursor: pointer; }
.tab-btn.active { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.card { border: 1px solid #d1d5db; border-radius: 10px; padding: 0.7rem 0.8rem; margin-bottom: 0.7rem; background: #fafafa; }
.card .word { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }
.drop-zone { border: 2px dashed #9ca3af; border-radius: 8px; padding: 0.5rem 0.6rem; font-size: 0.95rem; min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; background: #fff; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-bottom: 0.5rem; line-height: 1.3; }
.drop-zone.ready         { border-color: #1a56db; background: #e8f0fe; }
.drop-zone.matched-ok    { border: 2px solid #1e3a5f; background: #eaf0f7; color: #1e3a5f; font-weight: 500; cursor: default; pointer-events: none; }
.drop-zone.matched-wrong { border: 2px solid #dc2626; background: #fef2f2; animation: shake 0.35s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.chip { display: inline-flex; background: #1e3a5f; color: #fff; border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.95rem; cursor: pointer; user-select: none; line-height: 1.3; transition: background 0.12s; text-align: center; }
.chip:hover    { background: #162d4a; }
.chip.selected { background: #1a56db; }
.chip.placed   { visibility: hidden; pointer-events: none; }
.card .chip { width: 100%; justify-content: center; }
.controls { display: flex; justify-content: center; margin-top: 0.8rem; }
.controls button { font-size: 1rem; padding: 0.6rem 1.4rem; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #555; cursor: pointer; }
</style>
</head>
<body>
<div class="quiz-header">
  <h1>Vocabulary – Present progressive</h1>
</div>
<div class="score-bar">
  <span>Correct: <b id="cnt-c">0</b></span>
  <span>Wrong: <b id="cnt-w">0</b></span>
  <span>Left: <b id="cnt-l">0</b></span>
</div>
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(0)">Words 1–10</button>
  <button class="tab-btn" onclick="switchTab(1)">Words 11–12</button>
</div>
<div class="tab-panel active" id="panel-0"><div id="rows-0"></div></div>
<div class="tab-panel" id="panel-1"><div id="rows-1"></div></div>
<div class="controls">
  <button onclick="resetAll()">↺ Reset</button>
</div>
<script>
const PAIRS_ALL = [
  ["referee", "a person who controls a sports game (Schiedsrichter)"],
  ["injured", "hurt physically (verletzt)"],
  ["frustrated", "annoyed because sth. (something) is not going well (frustriert)"],
  ["to take part in sth.", "to join an activity (teilnehmen)"],
  ["to compete", "to try to win against others (antreten)"],
  ["tournament", "a competition with several matches (Turnier)"],
  ["exercise bike", "a bike used for training indoors (Heimtrainer)"],
  ["back and forth", "from one place to another and back (hin und her)"],
  ["whistle", "a small object that makes a loud sound (Pfeife)"],
  ["to shout at sb.", "to say sth. loudly and angrily to sb. (jemanden anschreien)"],
  ["save", "a goalkeeper's action to stop a goal (Parade)"],
  ["to join sb./sth.", "to become part of a group or activity (dazukommen)"],
];
const TABS = [PAIRS_ALL.slice(0, 10), PAIRS_ALL.slice(10, 12)];

let correct = 0, wrong = 0, selectedChip = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function deselectAll() {
  document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.drop-zone.ready').forEach(z => z.classList.remove('ready'));
  selectedChip = null;
}

function updateScore() {
  document.getElementById('cnt-c').textContent = correct;
  document.getElementById('cnt-w').textContent = wrong;
  const left = document.querySelectorAll('.drop-zone:not(.matched-ok)').length;
  document.getElementById('cnt-l').textContent = left;
}

function buildTab(pairs, containerId) {
  const shuffledDef = shuffle(pairs.map(p => p[1]));
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  pairs.forEach(([word, def], i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const wordEl = document.createElement('div');
    wordEl.className = 'word';
    wordEl.textContent = word;

    const drop = document.createElement('div');
    drop.className = 'drop-zone';
    drop.dataset.answer = def;
    drop.addEventListener('click', () => {
      if (!selectedChip) return;
      if (selectedChip.dataset.value === drop.dataset.answer) {
        drop.textContent = selectedChip.dataset.value;
        drop.classList.add('matched-ok');
        drop.classList.remove('ready');
        selectedChip.classList.add('placed');
        correct++;
        updateScore();
        deselectAll();
      } else {
        wrong++;
        drop.classList.add('matched-wrong');
        setTimeout(() => drop.classList.remove('matched-wrong'), 400);
        updateScore();
      }
    });

    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = shuffledDef[i];
    chip.dataset.value = shuffledDef[i];
    chip.addEventListener('click', () => {
      if (chip.classList.contains('placed')) return;
      if (chip.classList.contains('selected')) { deselectAll(); return; }
      deselectAll();
      chip.classList.add('selected');
      chip.closest('.tab-panel').querySelectorAll('.drop-zone:not(.matched-ok)').forEach(z => z.classList.add('ready'));
      selectedChip = chip;
    });

    card.appendChild(wordEl);
    card.appendChild(drop);
    card.appendChild(chip);
    container.appendChild(card);
  });
}

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function resetAll() {
  correct = 0; wrong = 0; selectedChip = null;
  buildTab(TABS[0], 'rows-0');
  buildTab(TABS[1], 'rows-1');
  updateScore();
}

resetAll();

document.addEventListener('click', e => {
  if (!e.target.closest('.chip') && !e.target.closest('.drop-zone')) deselectAll();
});
</script>
</body>
</html>
